spring.application.name=finance-tracker

# The same jar runs from an IDE against `docker compose up postgres` and inside
# compose against the `postgres` service; only the environment differs.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/finance_tracker}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:finance}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:finance}

# The schema belongs to Flyway. Hibernate may only check that it agrees.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true

# Deliberately above the 5 MB a statement may be, so that the application refuses an
# oversized upload with its own 400 and a message naming the limit, rather than the
# container refusing it first with a generic one. Anything past this is not worth
# buffering to tell someone about, and is refused as 400 by the exception handler.
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

spring.data.web.pageable.default-page-size=20
spring.data.web.pageable.max-page-size=100

springdoc.swagger-ui.path=/swagger-ui.html
springdoc.scalar.path=/scalar

# The Kurs API (official NBS rates, no key). Base URL is a property so that the tests
# can bind a real HTTP server to it: ADR-0006 fakes this at the HTTP boundary rather
# than behind a Java interface, because an unpublished currency and a transport failure
# are a distinction between HTTP outcomes.
app.kurs.base-url=https://kurs.resenje.org
# A rate is resolved while somebody waits for an upload to be accepted, so the client
# gives up rather than holding the request open. Giving up is a 503 that writes nothing
# (ADR-0005), which the person recovers from by uploading the same file again.
app.kurs.connect-timeout=3s
app.kurs.read-timeout=5s

# Kurs publishes the day's rates at 08:00 Belgrade time, so the job runs after that, on
# working days only. It is a warm-up and not the only source: ADR-0005 has the import
# fetch whatever date it is actually missing.
app.exchange-rates.refresh-cron=0 15 8 * * MON-FRI
