# Build and test on every push. The suite is Testcontainers-weighted (ADR-0006), so the
# runner has to be one with a Docker daemon: `ubuntu-latest` has one running and needs no
# service container or setup step for it. A `windows-latest` or `macos-latest` runner does
# not, and this workflow would fail there at the first test class.
name: build

on:
  push:
  workflow_dispatch:

# A second push to the same branch makes the first run's answer worthless. In-progress
# runs on `main` are left alone, because a green commit there is the thing CI is for.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  build:
    name: mvn verify
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v5

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          # Caches ~/.m2/repository keyed on pom.xml, so a run that changes no dependency
          # does not re-download Boot, Hibernate and Testcontainers.
          cache: maven

      # The client is part of the Maven build (ADR-0008), so this job compiles and tests it
      # too. `setup-node` is here only for its npm cache: the build downloads its own Node,
      # pinned in the pom, and does not use the one this step installs — which is the point,
      # because the version CI builds with must be the version `docker compose` builds with.
      - name: Set up Node for the npm cache
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # `verify`, not `test`: it packages the jar as well, so a build that cannot produce
      # the artifact the Dockerfile copies fails here rather than at `docker compose up`.
      # It runs both suites — 174 Java tests and the client's vitest run — and typechecks
      # the client before bundling it, so a TypeScript error is a red build here and not a
      # blank page later.
      # Nothing here overrides the pom's two-pass forked compile — read ADR-0007 before
      # adding anything clever to this line.
      - name: Build and test
        run: ./mvnw -B verify

      # The detector from issue 07. A green suite is not by itself evidence the class
      # files are sound: the corruption it looks for produced green builds whose
      # application could not start. Cheap enough to run on every push, and the one thing
      # CI can watch that a test cannot.
      #
      # The generated metamodel is searched for too, and not only the hand-written
      # sources: ADR-0007 found the damage was always in or near the classes the
      # processor generates, and those have no file under src/.
      - name: Check no class file names a project class without its package
        run: |
          names=$(find src/main/java src/test/java target/generated-sources \
                    -name '*.java' -exec basename {} .java \; | sort -u)
          classes=$(find target/classes target/test-classes -name '*.class')
          # shellcheck disable=SC2086  # $classes is a list of paths and is meant to split
          miscompiled=$(for n in $names; do
            { grep -a -l -E "(^|[^/[:alnum:]_])L$n;" $classes || true; } | sed "s|^|$n <- |"
          done)
          if [ -n "$miscompiled" ]; then
            echo "Miscompiled class files (see docs/adr/0007):"
            echo "$miscompiled"
            exit 1
          fi
          echo "No miscompiled class files."

      # The reports say which test failed; the surefire dumps say what the JVM was doing
      # when a test did not fail so much as vanish, which is how ADR-0007's bug looked.
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: surefire-reports
          path: target/surefire-reports/
          if-no-files-found: ignore

  stack:
    name: docker compose up
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      # `docker compose up` is the first thing the README tells a reader to run, so it is
      # also the first thing CI should prove still works — including the multi-stage
      # build, which compiles from scratch in the Maven image and is the only place the
      # forked compile of ADR-0007 runs against a different JDK installation than the
      # `build` job's. `--wait` returns when the app's healthcheck passes, which means it
      # is answering requests rather than merely running.
      #
      # Tests are skipped inside the image build: the `build` job ran them, and running
      # the Java ones there would need a Docker daemon inside the build container. The
      # client's tests are skipped alongside them, by `-Dfrontend.test.skip=true` in the
      # Dockerfile — Maven's own `-DskipTests` is not a flag frontend-maven-plugin reads.
      # The client is still *built* there, because the image would otherwise have no UI.
      - name: Build the image and start the stack
        run: docker compose up -d --build --wait --wait-timeout 300

      # The acceptance criterion of issue 06, as far as CI can honestly assert it: upload
      # a statement to a clean database and read a report back with real category names in
      # it, with no setup in between.
      #
      # Dinar lines only, deliberately. The reference sample.csv carries a euro line, and
      # ADR-0005 has a foreign line resolve its rate from the National Bank at import
      # time: uploading it here would make an outage at kurs.resenje.org a red build on a
      # commit that changed nothing. The euro path is covered by the suite instead, where
      # Kurs is faked at the HTTP boundary (ADR-0006).
      - name: Import a statement and read the report back
        run: |
          cat > /tmp/dinars.csv <<'CSV'
          date,description,amount,currency
          01.11.2026,PLATA OKTOBAR,95000.00,RSD
          03.11.2026,MAXI 245 BEOGRAD,-2450.80,RSD
          05.11.2026,EPS SNABDEVANJE,-4870.00,RSD
          CSV
          summary=$(curl --fail --silent --show-error \
            -F file=@/tmp/dinars.csv http://localhost:8080/api/imports)
          echo "$summary"
          case "$summary" in
            *'"importedRows":3'*) ;;
            *) echo "The import did not take all three lines."; exit 1 ;;
          esac

          report=$(curl --fail --silent --show-error \
            'http://localhost:8080/api/reports/monthly?year=2026&month=11')
          echo "$report"
          case "$report" in
            *'"categoryName":"Utilities"'*) ;;
            *) echo "The report came back without the seeded category names."; exit 1 ;;
          esac

      # The client is in the same jar and on the same port (ADR-0008), so the stack that
      # serves the API has to be serving the page too. Three things are asserted, because
      # the ways this breaks are distinct: the page is missing from the jar, a client route
      # 404s on reload, or the catch-all that fixes that has started swallowing the API.
      - name: The stack serves the client as well as the API
        run: |
          shell=$(curl --fail --silent --show-error http://localhost:8080/)
          case "$shell" in
            *'<div id="root">'*) ;;
            *) echo "GET / did not return the client's shell:"; echo "$shell"; exit 1 ;;
          esac

          # A client route, as a reload would ask for it: HTML, not a 404.
          curl --fail --silent --show-error http://localhost:8080/transactions > /dev/null

          # And the API still answers with JSON rather than with that HTML.
          type=$(curl --silent --output /dev/null --write-out '%{content_type}' \
            http://localhost:8080/api/categories)
          case "$type" in
            application/json*) ;;
            *) echo "The SPA forward is shadowing the API: /api/categories returned $type"; exit 1 ;;
          esac

      - name: Show the application log on failure
        if: failure()
        run: docker compose logs --no-color app

      - name: Stop the stack
        if: always()
        run: docker compose down -v
